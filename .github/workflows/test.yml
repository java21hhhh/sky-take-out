name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 只跑单元测试：44 个用例不依赖 MySQL / Redis。
      # 集成测试打了 @Tag("integration")，surefire 默认排除（见 sky-server/pom.xml）。
      - name: Unit tests
        run: mvn -B test
